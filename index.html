<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥑</text></svg>" />
    
    <!-- Android & Mobile PWA Optimization -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary Meta Tags -->
    <title>Forma | AI Health, Nutrition & Fitness Performance Suite</title>
    <meta name="title" content="Forma | AI Health, Nutrition & Fitness Performance Suite" />
    <meta name="description" content="Forma — Enterprise AI food scanner, WHO/ICMR clinical nutrition engine, Indian family meal logs, adaptive 1000+ workout generator, and certified medical biomarker analyzer." />
    <meta name="keywords" content="nutrition tracker, AI food scanner, clinical diet planner, Indian calorie counter, WHO BMR calculator, workout generator, biomarker analysis, macro tracker" />
    <meta name="author" content="Forma AI Health" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://forma-ai.io/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://forma-ai.io/" />
    <meta property="og:title" content="Forma | AI Health, Nutrition & Fitness Performance Suite" />

    <meta property="og:image" content="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:site_name" content="Forma AI" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://forma-ai.io/" />
    <meta property="twitter:title" content="Forma | AI Health, Nutrition & Fitness Performance Suite" />
    <meta property="twitter:description" content="Instant AI vision recognition, WHO/ICMR scientific macro planning, budget-optimized meal plans, and personalized athletic periodization." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Forma AI",
      "url": "https://forma-ai.io/",
      "description": "Clinical Nutrition, AI Vision Food Scanner, 7-Day Meal Scheduler, and Metabolic Performance Suite.",

      "operatingSystem": "Android, iOS, Windows, macOS, Linux",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Google Fonts: Montserrat, Plus Jakarta Sans & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 font-body antialiased min-h-screen selection:bg-emerald-500 selection:text-white">
