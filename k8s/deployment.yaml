apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-ai-deployment
  namespace: fitforge-production
  labels:
    app: tracker-ai
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tracker-ai
  template:
    metadata:
      labels:
        app: tracker-ai
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: tracker-ai-app
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/tracker-ai:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
