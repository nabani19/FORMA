server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Production HTTP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://openrouter.ai https:;" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 '{"status":"UP","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
